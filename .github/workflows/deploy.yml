name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploys via the Pages artifact rather than by committing dist/ to a branch.
# The baked tileset is large and changes wholesale on every re-bake, so
# committing it would grow repository history past the 1 GB limit within a
# handful of iterations.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # GitHub's own recommendation here is false, so that a half-finished
  # deployment is never killed. That is the right default when runs complete;
  # it is the wrong one during an incident. On 2026-08-06 Actions and Pages
  # were degraded for hours and every push queued behind runs that could not
  # finish, so the backlog only grew and none of it was work anyone wanted —
  # each queued run builds the same commit's successor. Superseding is the
  # behaviour that matches what a deploy of `master` means.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # The baked tileset is committed (see .gitignore for why), so the build
      # output is self-contained and no bake runs here.
      # Structural rather than a hard-coded path. The previous version checked
      # for dist/tiles/berlin/tileset.json, which a rename to berlin-mitte/all
      # quietly invalidated — so every deploy after it failed here, correctly
      # refusing to publish a world it could not find, while looking from the
      # outside like the Actions incident that was running at the time.
      - name: Check the world is actually present
        run: |
          if [ ! -d dist/tiles ]; then
            echo "::error::dist/tiles is missing — the deploy would publish no world at all"
            exit 1
          fi
          fail=0
          for city in dist/tiles/*/; do
            [ -d "$city" ] || continue
            layers=$(find "$city" -name tileset.json | wc -l)
            if [ "$layers" -eq 0 ]; then
              echo "::error::$city has no tileset.json — expected tiles/<city>/<layer>/tileset.json"
              fail=1
            else
              echo "$(basename "$city"): $layers layer tileset(s)"
            fi
          done
          cities=$(find dist/tiles -mindepth 1 -maxdepth 1 -type d | wc -l)
          tiles=$(find dist/tiles \( -name '*.glb' -o -name '*.b3dm' \) | wc -l)
          echo "$cities cities, $tiles tiles"
          # A world that builds but carries almost nothing is the failure this
          # guard exists for, and it does not announce itself any other way.
          if [ "$cities" -eq 0 ] || [ "$tiles" -lt 50 ]; then
            echo "::error::only $cities cities and $tiles tiles — refusing to publish an empty world"
            fail=1
          fi
          exit $fail

      - name: Check published size against the 1 GB Pages limit
        run: |
          SIZE=$(du -sb dist | cut -f1)
          LIMIT=$((1024 * 1024 * 1024))
          echo "dist is $(du -sh dist | cut -f1) — $((SIZE * 100 / LIMIT))% of the 1 GB limit"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::dist exceeds the 1 GB GitHub Pages limit"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
